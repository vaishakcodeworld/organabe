<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D scene showcasing stylized Oyster & Milky mushrooms with soft natural floating animation and organic lighting
const container = document.getElementById('mushroom-3d-canvas') || (typeof container !== 'undefined' ? container : document.body);

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.2, 5.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xfcf8f0, 1.2);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xfff3db, 2.0);
mainLight.position.set(5, 8, 4);
mainLight.castShadow = true;
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0xa5d6a7, 1.2);
rimLight.position.set(-5, 3, -3);
scene.add(rimLight);

const warmPoint = new THREE.PointLight(0xe6c387, 1.5, 10);
warmPoint.position.set(0, -1, 2);
scene.add(warmPoint);

// Root Group
const sceneGroup = new THREE.Group();
scene.add(sceneGroup);

// Organic Ground Platform with Moss / Earth
const soilGeo = new THREE.CylinderGeometry(2.6, 3.0, 0.4, 40);
const soilMat = new THREE.MeshLambertMaterial({ color: 0x24331e });
const soil = new THREE.Mesh(soilGeo, soilMat);
soil.position.y = -1.6;
sceneGroup.add(soil);

const mossGeo = new THREE.CylinderGeometry(2.62, 2.65, 0.1, 40);
const mossMat = new THREE.MeshLambertMaterial({ color: 0x3b582b });
const moss = new THREE.Mesh(mossGeo, mossMat);
moss.position.y = -1.4;
sceneGroup.add(moss);

// Materials
const oysterCapMat = new THREE.MeshPhongMaterial({
  color: 0xcebba6,
  shininess: 35,
  specular: 0x554433,
  flatShading: false
});

const milkyCapMat = new THREE.MeshPhongMaterial({
  color: 0xfbf9f5,
  shininess: 45,
  specular: 0xffffff,
  flatShading: false
});

const stemMat = new THREE.MeshLambertMaterial({
  color: 0xede4d4
});

const sporeMat = new THREE.PointsMaterial({
  color: 0xd4af37,
  size: 0.04,
  transparent: true,
  opacity: 0.65
});

// Helper: Oyster Mushroom (Layered, fan-shaped shell caps)
function createOysterMushroom(scale, posX, posY, posZ, rotY, rotZ) {
  const cluster = new THREE.Group();
  
  // curved stem
  const stemCurve = new THREE.CylinderGeometry(0.08 * scale, 0.13 * scale, 1.1 * scale, 16);
  const stem = new THREE.Mesh(stemCurve, stemMat);
  stem.position.y = (0.55 * scale);
  stem.rotation.z = 0.25;
  cluster.add(stem);

  // layered tiered caps
  for (let i = 0; i < 3; i++) {
    const capGeo = new THREE.SphereGeometry(0.55 * scale * (1 - i * 0.2), 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.42);
    capGeo.scale(1.4, 0.35, 1.0);
    const cap = new THREE.Mesh(capGeo, oysterCapMat);
    cap.position.set(0.12 * scale * i, (0.75 + i * 0.3) * scale, 0.05 * i);
    cap.rotation.x = 0.15;
    cap.rotation.z = -0.3 + (i * 0.1);
    cluster.add(cap);
  }

  cluster.position.set(posX, posY, posZ);
  cluster.rotation.y = rotY;
  cluster.rotation.z = rotZ;
  return cluster;
}

// Helper: Milky Mushroom (Plump, bulbous, elegant pure white domed cap)
function createMilkyMushroom(scale, posX, posY, posZ) {
  const mushroom = new THREE.Group();

  // Thick plump stem
  const stemGeo = new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 1.4 * scale, 24);
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.y = 0.7 * scale;
  mushroom.add(stem);

  // Velvety dome cap
  const capGeo = new THREE.SphereGeometry(0.65 * scale, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.52);
  capGeo.scale(1.1, 0.68, 1.1);
  const cap = new THREE.Mesh(capGeo, milkyCapMat);
  cap.position.y = 1.35 * scale;
  mushroom.add(cap);

  // Under-gills disc
  const gillsGeo = new THREE.CylinderGeometry(0.6 * scale, 0.15 * scale, 0.08 * scale, 30);
  const gillsMat = new THREE.MeshLambertMaterial({ color: 0xdfd4be });
  const gills = new THREE.Mesh(gillsGeo, gillsMat);
  gills.position.y = 1.32 * scale;
  mushroom.add(gills);

  mushroom.position.set(posX, posY, posZ);
  return mushroom;
}

// Build Oyster Cluster (Left side)
const oyster1 = createOysterMushroom(1.4, -1.1, -1.4, 0.1, 0.4, 0.1);
const oyster2 = createOysterMushroom(1.0, -1.6, -1.4, -0.4, 0.9, -0.15);
const oyster3 = createOysterMushroom(0.85, -0.7, -1.4, 0.5, -0.3, 0.2);
sceneGroup.add(oyster1);
sceneGroup.add(oyster2);
sceneGroup.add(oyster3);

// Build Milky Mushroom Family (Right side)
const milkyBig = createMilkyMushroom(1.45, 0.9, -1.4, 0.1);
const milkyMedium = createMilkyMushroom(1.0, 1.7, -1.4, -0.3);
const milkyBaby = createMilkyMushroom(0.65, 0.35, -1.4, 0.7);
sceneGroup.add(milkyBig);
sceneGroup.add(milkyMedium);
sceneGroup.add(milkyBaby);

// Ambient Floating Spores / Golden Pollen
const sporesCount = 120;
const sporesGeometry = new THREE.BufferGeometry();
const sporePositions = new Float32Array(sporesCount * 3);
for (let i = 0; i < sporesCount * 3; i += 3) {
  sporePositions[i] = (Math.random() - 0.5) * 6;
  sporePositions[i + 1] = Math.random() * 4 - 1.5;
  sporePositions[i + 2] = (Math.random() - 0.5) * 5;
}
sporesGeometry.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));
const sporeParticles = new THREE.Points(sporesGeometry, sporeMat);
scene.add(sporeParticles);

// Interaction & Animation Loop
let targetRotationY = 0;
let targetRotationX = 0;
let mouseX = 0;
let mouseY = 0;

function onMouseMove(event) {
  mouseX = (event.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
  targetRotationY = mouseX * 0.45;
  targetRotationX = -mouseY * 0.2;
}
window.addEventListener('mousemove', onMouseMove);

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth lerp rotation towards mouse
  sceneGroup.rotation.y += (targetRotationY - sceneGroup.rotation.y) * 0.05;
  sceneGroup.rotation.x += (targetRotationX - sceneGroup.rotation.x) * 0.05;

  // Gentle organic floating
  sceneGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.08;

  // Delicate swaying of oyster clusters
  oyster1.rotation.z = 0.1 + Math.sin(elapsedTime * 1.8) * 0.04;
  oyster2.rotation.z = -0.15 + Math.cos(elapsedTime * 1.6) * 0.03;

  // Milky slight pulse breathing
  const pulse = 1.0 + Math.sin(elapsedTime * 2.0) * 0.015;
  milkyBig.scale.set(pulse, 1.0, pulse);

  // Spores floating upwards
  const pos = sporesGeometry.attributes.position.array;
  for (let i = 1; i < sporesCount * 3; i += 3) {
    pos[i] += 0.005;
    if (pos[i] > 3) pos[i] = -1.5;
  }
  sporesGeometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
